services:
  - type: web
    name: tasksync-portfolio
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "daphne tasksync.asgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_SETTINGS_MODULE
        value: tasksync.settings
      - key: PORT
        value: 8000
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
